<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A440 Tone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: single centered instrument panel — oscilloscope trace above, one transport button below */
:root {
  --bg: #eef1f3;
  --panel: #ffffff;
  --fg: #1b2228;
  --muted: #5d6a74;
  --line: #d3dade;
  --accent: #0a7a6c;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171b; --panel: #1a2126; --fg: #e4eaee; --muted: #8d9aa3; --line: #2c363d; --accent: #3fd0b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171b; --panel: #1a2126; --fg: #e4eaee; --muted: #8d9aa3; --line: #2c363d; --accent: #3fd0b8;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui);
  display: grid; place-items: center;
  padding-inline: 16px; padding-block: 24px;
  box-sizing: border-box;
}
.panel {
  width: 100%; max-width: 420px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 24px;
  display: grid; gap: 20px;
  box-sizing: border-box;
}
.readout { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.freq { font-family: var(--font-data); font-size: 2.5rem; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.freq span { font-size: 1rem; color: var(--muted); margin-left: 4px; }
.note { font-family: var(--font-data); font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
canvas { width: 100%; height: 120px; display: block; border: 1px solid var(--line); border-radius: 6px; }
button {
  font: 600 1rem var(--font-ui);
  background: var(--accent); color: var(--panel);
  border: 0; border-radius: 6px;
  padding: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
button svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>

<main class="panel">
  <div class="readout">
    <div class="freq">440<span>Hz</span></div>
    <div class="note">A4 · sine</div>
  </div>
  <canvas id="scope" aria-hidden="true"></canvas>
  <button id="toggle" type="button" aria-pressed="false">
    <svg id="icon" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
    <span id="label">Play</span>
  </button>
</main>

<script>
const btn = document.getElementById('toggle');
const label = document.getElementById('label');
const icon = document.getElementById('icon');
const canvas = document.getElementById('scope');
const ctx2d = canvas.getContext('2d');
const PLAY = '<path d="M3 1.5v13l11-6.5z"/>';
const PAUSE = '<path d="M3 1.5h3.5v13H3zM9.5 1.5H13v13H9.5z"/>';

let ac, osc, gain, playing = false;
let level = 0, phase = 0, last = performance.now();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setup() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 440;
  gain = ac.createGain();
  gain.gain.value = 0;
  osc.connect(gain).connect(ac.destination);
  osc.start();
}

async function toggle() {
  if (!ac) setup();
  if (ac.state === 'suspended') await ac.resume();
  playing = !playing;
  const t = ac.currentTime;
  gain.gain.cancelScheduledValues(t);
  gain.gain.setValueAtTime(gain.gain.value, t);
  // short ramp avoids clicks
  gain.gain.linearRampToValueAtTime(playing ? 0.2 : 0, t + 0.03);
  label.textContent = playing ? 'Pause' : 'Play';
  icon.innerHTML = playing ? PAUSE : PLAY;
  btn.setAttribute('aria-pressed', String(playing));
}
btn.addEventListener('click', toggle);

function draw(now) {
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2d.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const line = cs.getPropertyValue('--line'), accent = cs.getPropertyValue('--accent');
  ctx2d.strokeStyle = line; ctx2d.lineWidth = 1;
  ctx2d.beginPath(); ctx2d.moveTo(0, h / 2); ctx2d.lineTo(w, h / 2); ctx2d.stroke();

  const dt = (now - last) / 1000; last = now;
  level += ((playing ? 1 : 0) - level) * Math.min(1, dt * 12);
  if (playing && !reduce) phase += dt * 2;

  // 4 cycles visible across the width
  ctx2d.strokeStyle = accent; ctx2d.lineWidth = 2;
  ctx2d.beginPath();
  for (let x = 0; x <= w; x++) {
    const y = h / 2 - Math.sin((x / w) * Math.PI * 8 - phase * Math.PI * 2) * (h * 0.38) * level;
    x ? ctx2d.lineTo(x, y) : ctx2d.moveTo(x, y);
  }
  ctx2d.stroke();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
