<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Z logo made of two triangles">
  <defs>
    <!-- 3-colour gradient -->
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173950"/>
      <stop offset="0.5" stop-color="#645b78"/>
      <stop offset="1" stop-color="#02253b"/>
    </linearGradient>

    <!-- subtle outline: bright on top-left edges, faint on bottom-right -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfcff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ecfcff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ecfcff" stop-opacity="0.45"/>
    </linearGradient>

    <!-- grain texture, clipped to the shape -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="2" numOctaves="1" seed="7" result="noise"/>
      <!-- <feColorMatrix in="noise" type="matrix" -->
      <!--   values="0.33 0.33 0.33 0 0 -->
      <!--           0.33 0.33 0.33 0 0 -->
      <!--           0.33 0.33 0.33 0 0 -->
      <!--           0    0    0    0 1" result="gray"/> -->
      <!-- <feComponentTransfer in="gray" result="contrast"> -->
      <!--   <feFuncR type="linear" slope="2.2" intercept="-0.6"/> -->
      <!--   <feFuncG type="linear" slope="2.2" intercept="-0.6"/> -->
      <!--   <feFuncB type="linear" slope="2.2" intercept="-0.6"/> -->
      <!-- </feComponentTransfer> -->
      <feBlend in="SourceGraphic" in2="contrast" mode="soft-light" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- soft drop shadow for the "pop out" effect -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="4" dy="7" result="blur"/>
      <feFlood flood-color="#fff8e8" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#lift)">
    <g filter="url(#grain)">
      <!-- upper-left triangle: flat top edge of the Z -->
      <polygon points="20,20 140,20 20,140" fill="url(#fill)"/>
      <!-- lower-right triangle: flat bottom edge of the Z -->
      <polygon points="180,180 60,180 180,60" fill="url(#fill)"/>
    </g>
    <!-- outline drawn on top of the grain so it stays clean -->
    <g fill="none" stroke="url(#rim)" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="20,20 140,20 20,140"/>
      <polygon points="180,180 60,180 180,60"/>
    </g>
  </g>
</svg>
